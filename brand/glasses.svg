<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- MyEyes! mark: happy glasses, blue->purple gradient (see brand/reference/) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0.1" x2="1" y2="0.4">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- temples -->
    <path d="M8 54 L1 47"/>
    <path d="M120 54 L127 47"/>
    <!-- bridge -->
    <path d="M54 56 Q64 46 74 56"/>
    <!-- lenses -->
    <rect x="8" y="42" width="46" height="46" rx="16"/>
    <rect x="74" y="42" width="46" height="46" rx="16"/>
    <!-- smiling eyes -->
    <path d="M22 62 Q31 74 40 62"/>
    <path d="M88 62 Q97 74 106 62"/>
  </g>
</svg>
